<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书目录 - XML 数据展示</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f5f6f8;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 30px 40px;
    }
    h1 {
      text-align: center;
      color: #1a3a5c;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid #e3e6ea;
    }
    th {
      background-color: #eef2f6;
      color: #1a3a5c;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f8fafc;
    }
    .price {
      color: #b4551e;
      font-weight: 600;
    }
    #status {
      text-align: center;
      color: #999;
      padding: 30px 0;
    }
    #error {
      text-align: center;
      color: #c0392b;
      padding: 20px 0;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 图书目录</h1>
    <p class="subtitle">数据来源于 book.xml（通过 Fetch API + DOMParser 解析 XML）</p>

    <div id="status">正在加载 XML 数据…</div>
    <div id="error"></div>
    <table id="bookTable" style="display:none;">
      <thead>
        <tr>
          <th>ID</th>
          <th>书名 Title</th>
          <th>作者 Author</th>
          <th>价格 Price</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    fetch('book.xml')
      .then(response => {
        if (!response.ok) {
          throw new Error('Fetch error: ' + response.status);
        }
        return response.text();
      })
      .then(xmlText => {
        // 将 XML 字符串解析为 XML 文档对象
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

        // 检查 XML 是否解析出错（解析错误时文档中会出现 <parsererror> 节点）
        const parseError = xmlDoc.getElementsByTagName('parsererror');
        if (parseError.length > 0) {
          throw new Error('XML 解析失败，请检查 book.xml 格式');
        }

        // 取出所有 <book> 元素
        const books = xmlDoc.getElementsByTagName('book');
        const tbody = document.querySelector('#bookTable tbody');

        // 遍历每本图书，提取 title / author / price 子元素
        for (let i = 0; i < books.length; i++) {
          const book = books[i];
          const id = book.getAttribute('id');
          const title = book.getElementsByTagName('title')[0].textContent;
          const author = book.getElementsByTagName('author')[0].textContent;
          const price = book.getElementsByTagName('price')[0].textContent;

          const tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + id + '</td>' +
            '<td>' + title + '</td>' +
            '<td>' + author + '</td>' +
            '<td class="price">$' + price + '</td>';
          tbody.appendChild(tr);
        }

        // 显示表格，隐藏加载提示
        document.getElementById('status').style.display = 'none';
        document.getElementById('bookTable').style.display = '';
      })
      .catch(err => {
        document.getElementById('status').style.display = 'none';
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'block';
        errorDiv.textContent = '加载失败：' + err.message;
      });
  </script>
</body>
</html>
